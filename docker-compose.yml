services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miedificio}
      POSTGRES_USER: ${POSTGRES_USER:-miedificio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miedificio_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miedificio} -d ${POSTGRES_DB:-miedificio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [miedificio]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://miedificio:miedificio_local@db:5432/miedificio}
      JWT_SECRET: ${JWT_SECRET:-local-only-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8000:8000"
    volumes:
      - payment_receipts:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [miedificio]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "8080:80"
    depends_on: [backend]
    networks: [miedificio]

volumes:
  postgres_data:
  payment_receipts:

networks:
  miedificio:
    driver: bridge

