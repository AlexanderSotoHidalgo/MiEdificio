name: Backend CI
on:
  pull_request:
    paths: ["backend/**", "docker-compose*.yml", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: miedificio
          POSTGRES_USER: miedificio
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miedificio -d miedificio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://miedificio:ci-password@localhost:5432/miedificio
      TEST_DATABASE_URL: postgresql+psycopg://miedificio:ci-password@localhost:5432/miedificio_test
      JWT_SECRET: ci-secret-with-at-least-thirty-two-characters
      UPLOAD_DIR: /tmp/miedificio-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest -q
